name: CI - Release and Docker Build

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  release-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run semantic-release (frontend)
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --no-ci

      - name: Build backend
        working-directory: api/SpendingTracker.Api
        run: dotnet build SpendingTracker.Api.csproj --configuration Release

      - name: Build Docker images
        run: |
          docker build -t spending-tracker-frontend:latest -f frontend/Dockerfile frontend
          docker build -t spending-tracker-api:latest -f SpendingTracker.Api/Dockerfile SpendingTracker.Api || true

      - name: Push Docker images (GitHub Packages example)
        if: env.REGISTRY_PUSH == 'true'
        env:
          REGISTRY: ghcr.io
          IMAGE_PREFIX: ${{ github.repository_owner }}/spending-tracker
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Logging into GitHub Container Registry"
          echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
          docker tag spending-tracker-frontend:latest $REGISTRY/$IMAGE_PREFIX-frontend:${{ github.sha }}
          docker tag spending-tracker-frontend:latest $REGISTRY/$IMAGE_PREFIX-frontend:latest
          docker tag spending-tracker-api:latest $REGISTRY/$IMAGE_PREFIX-api:${{ github.sha }}
          docker tag spending-tracker-api:latest $REGISTRY/$IMAGE_PREFIX-api:latest
          docker push $REGISTRY/$IMAGE_PREFIX-frontend:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_PREFIX-frontend:latest
          docker push $REGISTRY/$IMAGE_PREFIX-api:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_PREFIX-api:latest

      - name: Output
        run: echo "Workflow completed"
