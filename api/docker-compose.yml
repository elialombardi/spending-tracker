services:
  spending-tracker-api:
    build:
      context: .
      dockerfile: SpendingTracker.Api/Dockerfile
    image: spending-tracker-api:latest
    container_name: spending-tracker-api
    restart: unless-stopped
    ports:
      - "${SPENDING_TRACKER_PORT:-8080}:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SPENDING_TRACKER_DB: /data/${SPENDING_TRACKER_DB_FILE:-spending-tracker.db}
      Auth__Issuer: ${AUTH_ISSUER:-SpendingTracker.Api}
      Auth__Audience: ${AUTH_AUDIENCE:-SpendingTracker.Client}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in your shell or .env file.}
      Auth__TokenLifetimeMinutes: ${AUTH_TOKEN_LIFETIME_MINUTES:-480}
      Auth__Users__0__Username: ${AUTH_USERNAME:?Set AUTH_USERNAME in your shell or .env file.}
      Auth__Users__0__Password: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in your shell or .env file.}
      Auth__Users__0__Role: ${AUTH_ROLE:-Admin}
    volumes:
      - ${SPENDING_TRACKER_DB_VOLUME:-./data}:/data