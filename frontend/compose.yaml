services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: test-api-frontend:latest
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      API_URL: "${API_URL:-https://localhost:7004}"
      VITE_PLACE_SEARCH_PROVIDER: "${VITE_PLACE_SEARCH_PROVIDER:-nominatim}"
      VITE_GEOAPIFY_API_KEY: "${VITE_GEOAPIFY_API_KEY:-}"
    restart: unless-stopped